<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>さくら坂写真コンテスト応募</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one screen at night — mincho title over a lit slope, 4 fields, 1 glowing button. Deliberately single dark look. */
:root {
  --night: #120f1c;
  --night-2: #1b1729;
  --field: #221d33;
  --line: #3d3552;
  --ink: #f7f1f5;
  --ink-soft: #b9adc4;
  --sakura: #ff9ec4;
  --sakura-deep: #f0679f;
  --gold: #f3d59a;
  --error: #ffb4a8;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: #120f1c; min-height: 100%; }
* { box-sizing: border-box; }
body {
  background:
    radial-gradient(120% 60% at 50% -10%, #2a1d3a 0%, transparent 60%),
    var(--night);
  color: var(--ink); font-family: var(--body); font-size: 22px; line-height: 1.4;
  padding-inline: 20px; padding-block: 20px; min-height: 100%;
}
main { max-width: 540px; margin: 0 auto; display: grid; gap: 22px; }

header { display: grid; gap: 6px; text-align: center; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: min(28px, calc((100vw - 44px) / 13)); line-height: 1.4; margin: 0;
  letter-spacing: .04em; 
}
h1 .ph { display: inline-block; white-space: nowrap; font-weight: inherit; }
h1 span { display: block; font-size: 17px; color: var(--sakura); letter-spacing: .3em; font-weight: 700; }
.slope { width: 100%; height: 34px; display: block; }
.slope circle { fill: var(--sakura); }
.slope circle:nth-child(3n) { fill: var(--gold); }
@media (prefers-reduced-motion: no-preference) {
  .slope circle { animation: tw 2.6s ease-in-out infinite; }
}
@keyframes tw { 50% { opacity: .35; } }

form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.q { font-size: 20px; font-weight: 700; color: var(--ink-soft); letter-spacing: .06em; }
input[type="text"], input[type="email"] {
  width: 100%; font: inherit; font-size: 24px; font-weight: 500; padding: 10px 16px; min-height: 60px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--field); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
input[type="text"]:focus, input[type="email"]:focus {
  outline: none; border-color: var(--sakura); box-shadow: 0 0 0 4px rgba(255,158,196,.22);
}
.photo-btn:focus-within, .btn:focus-visible { outline: 3px solid var(--sakura); outline-offset: 3px; }
.invalid input, .invalid .photo-btn { border-color: var(--error); }
.err { margin: 0; color: var(--error); font-weight: 700; font-size: 18px; }

.photo-btn {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 14px;
  height: 96px; padding: 8px 14px; border: 2px dashed var(--sakura); border-radius: 14px;
  background: rgba(255,158,196,.07); cursor: pointer; font-size: 23px; font-weight: 700; color: var(--sakura);
}
.photo-btn svg { flex: none; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.photo-btn img { height: 76px; width: auto; max-width: 55%; object-fit: cover; border-radius: 8px; }
.photo-btn.has { border-style: solid; }

.btn {
  width: 100%; min-height: 72px; margin-top: 6px; font: inherit; font-size: 27px; font-weight: 700;
  letter-spacing: .2em; border: 0; border-radius: 999px; cursor: pointer; color: #2a0a18;
  background: linear-gradient(180deg, var(--sakura), var(--sakura-deep));
  box-shadow: 0 8px 28px rgba(240,103,159,.35);
}
.btn:active { transform: translateY(1px); }

.done { display: grid; gap: 14px; text-align: center; padding-block: 48px 24px; }
.done h2 { font-family: var(--display); font-weight: 800; font-size: 34px; margin: 0; letter-spacing: .08em; }
.done p { margin: 0; color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>渋谷桜丘</span><b class="ph">さくら坂イルミネーション</b><b class="ph">写真コンテスト</b></h1>
    <svg class="slope" viewBox="0 0 540 34" preserveAspectRatio="none" aria-hidden="true" id="slope"></svg>
  </header>

  <form id="entry" novalidate>
    <div class="field" id="f-title">
      <label class="q" for="title">タイトル</label>
      <input type="text" id="title" autocomplete="off" maxlength="50">
      <p class="err" id="e-title" hidden></p>
    </div>
    <div class="field" id="f-name">
      <label class="q" for="name">お名前</label>
      <input type="text" id="name" autocomplete="name" maxlength="40">
      <p class="err" id="e-name" hidden></p>
    </div>
    <div class="field" id="f-photo">
      <span class="q" id="photo-q">写真</span>
      <label class="photo-btn" id="photo-btn">
        <svg id="cam" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6l1.4-2h4.2l1.4 2"/></svg>
        <img id="preview" alt="選んだ写真" hidden>
        <span id="photo-label">写真をえらぶ</span>
        <input type="file" id="photo" accept="image/jpeg,.jpg,.jpeg" aria-labelledby="photo-q">
      </label>
      <p class="err" id="e-photo" hidden></p>
    </div>
    <div class="field" id="f-email">
      <label class="q" for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="email" inputmode="email">
      <p class="err" id="e-email" hidden></p>
    </div>
    <button class="btn" type="submit">応募する</button>
  </form>

  <section class="done" id="done" hidden>
    <h2 id="d-h" tabindex="-1">応募しました</h2>
    <p>ありがとうございました</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let photoURL = null;

// さくら坂：ゆるい上り坂に並ぶ電飾
(function () {
  const svg = $('slope'), ns = 'http://www.w3.org/2000/svg', n = 27;
  for (let i = 0; i < n; i++) {
    const x = 10 + i * (520 / (n - 1)), y = 28 - i * (20 / (n - 1)) + (i % 2 ? -2 : 2);
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', i % 3 === 2 ? 2.2 : 3);
    c.style.animationDelay = (i * 0.17 % 2.6) + 's';
    svg.appendChild(c);
  }
})();

function setPhoto(url) {
  if (photoURL && photoURL.startsWith('blob:')) URL.revokeObjectURL(photoURL);
  photoURL = url;
  $('preview').src = url || ''; $('preview').hidden = !url; $('cam').hidden = !!url;
  $('photo-btn').classList.toggle('has', !!url);
  $('photo-label').textContent = url ? 'かえる' : '写真をえらぶ';
}
function setErr(k, msg) {
  $('e-' + k).textContent = msg || ''; $('e-' + k).hidden = !msg;
  $('f-' + k).classList.toggle('invalid', !!msg);
}

$('photo').addEventListener('change', e => {
  const f = e.target.files[0]; setErr('photo');
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return setErr('photo', '写真が大きすぎます');
  setPhoto(URL.createObjectURL(f));
});
['title', 'name', 'email'].forEach(k => $(k).addEventListener('input', () => setErr(k)));

$('entry').addEventListener('submit', e => {
  e.preventDefault();
  const v = { title: $('title').value.trim(), name: $('name').value.trim(), email: $('email').value.trim() };
  let first = null;
  if (!v.title) { setErr('title', 'タイトルを入れてください'); first ??= 'title'; }
  if (!v.name) { setErr('name', 'お名前を入れてください'); first ??= 'name'; }
  if (!photoURL) { setErr('photo', '写真をえらんでください'); first ??= 'photo'; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) { setErr('email', 'メールアドレスを確かめてください'); first ??= 'email'; }
  if (first) { if (first !== 'photo') $(first).focus(); return; }
  $('entry').hidden = true; $('done').hidden = false; $('d-h').focus();
});
</script>
</body>
</html>
