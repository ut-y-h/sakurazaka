<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#110e1a">
<title>さくら坂写真コンテスト応募</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one screen at night. Mincho title under a strung garland of lights, quiet glass fields, one lit button. Single dark look. */
:root {
  --night: #110e1a;
  --night-hi: #231a33;
  --glass: rgba(255, 255, 255, .045);
  --glass-hi: rgba(255, 255, 255, .075);
  --rule: rgba(255, 255, 255, .13);
  --ink: #f6f0f4;
  --ink-soft: #b4a9bf;
  --ink-faint: #776d86;
  --sakura: #ffa3c7;
  --sakura-deep: #ee6da3;
  --gold: #f5d9a3;
  --error: #ffb1a6;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", sans-serif;
  --gap: clamp(6px, 1.4dvh, 16px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--night); height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  padding-inline: 22px; padding-block: clamp(10px, 2.5dvh, 28px);
  color: var(--ink); font-family: var(--body); font-size: 22px; line-height: 1.4;
  background:
    radial-gradient(60% 34% at 50% 0%, rgba(255, 140, 190, .16), transparent 70%),
    radial-gradient(40% 30% at 0% 8%, rgba(245, 217, 163, .06), transparent 70%),
    radial-gradient(40% 30% at 100% 6%, rgba(255, 163, 199, .07), transparent 70%),
    linear-gradient(180deg, var(--night-hi) 0%, var(--night) 46%);
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%; max-width: 520px; max-height: 900px; margin: 0 auto; flex: 1;
  display: flex; flex-direction: column; gap: var(--gap);
}

/* Header */
header { display: grid; justify-items: center; gap: clamp(2px, .6dvh, 6px); text-align: center; }
.eyebrow {
  display: flex; align-items: center; gap: 12px;
  font-size: min(15px, 2.4dvh); font-weight: 700; letter-spacing: .4em; color: var(--sakura);
  padding-left: .4em;
}
.eyebrow::before, .eyebrow::after { content: ""; width: 28px; height: 1px; background: currentColor; opacity: .55; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.32;
  font-size: min(29px, calc((100vw - 48px) / 12.8), 4.1dvh); letter-spacing: .05em;
  font-feature-settings: "palt";
}
h1 .ph { display: inline-block; white-space: nowrap; }
.garland { width: 100%; height: clamp(18px, 3.6dvh, 34px); display: block; overflow: visible; }
.garland .wire { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 1; }
.garland .bulb { fill: var(--sakura); }
.garland .bulb.g { fill: var(--gold); }
@media (prefers-reduced-motion: no-preference) {
  .garland .bulb { animation: tw 3.2s ease-in-out infinite; }
}
@keyframes tw { 50% { opacity: .3; } }

/* Form */
form { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: var(--gap); }
.field { display: grid; gap: clamp(3px, .9dvh, 9px); }
.q { font-size: min(18px, 2.8dvh); font-weight: 700; color: var(--ink-soft); letter-spacing: .14em; }
input[type="text"], input[type="email"] {
  width: 100%; height: clamp(48px, 7.6dvh, 62px); padding: 4px 18px;
  font: inherit; font-size: 22px; font-weight: 500; color: var(--ink);
  background: var(--glass); border: 1px solid var(--rule); border-radius: 14px;
  transition: border-color .2s, background-color .2s, box-shadow .2s;
  -webkit-appearance: none; appearance: none;
}
input::placeholder { color: var(--ink-faint); opacity: 1; }
input[type="text"]:focus, input[type="email"]:focus {
  outline: none; background: var(--glass-hi); border-color: var(--sakura);
  box-shadow: 0 0 0 4px rgba(255, 163, 199, .16), 0 0 24px rgba(255, 163, 199, .12);
}
.photo-btn:focus-within, .btn:focus-visible { outline: 2px solid var(--sakura); outline-offset: 4px; }
.invalid input, .invalid .photo-btn { border-color: var(--error); }
.err { margin: 0; color: var(--error); font-weight: 700; font-size: 17px; letter-spacing: .04em; }

.photo-btn {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 14px;
  height: clamp(56px, 10dvh, 96px); padding: 6px 16px;
  border: 1px dashed rgba(255, 163, 199, .55); border-radius: 14px;
  background: rgba(255, 163, 199, .05); color: var(--sakura);
  font-size: 21px; font-weight: 700; letter-spacing: .08em; cursor: pointer;
  transition: background-color .2s, border-color .2s;
}
.photo-btn:hover { background: rgba(255, 163, 199, .09); }
.photo-btn .ico {
  flex: none; width: clamp(34px, 5.4dvh, 44px); height: clamp(34px, 5.4dvh, 44px); border-radius: 50%;
  display: grid; place-items: center; background: rgba(255, 163, 199, .14);
}
.photo-btn input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
.photo-btn img { height: calc(100% - 4px); width: auto; max-width: 55%; object-fit: cover; border-radius: 9px; }
.photo-btn.has { border-style: solid; border-color: rgba(255, 163, 199, .4); justify-content: space-between; padding-left: 4px; }
.photo-btn.has #photo-label { flex: 1; text-align: center; font-size: 19px; }

.btn {
  width: 100%; height: clamp(56px, 9dvh, 70px); margin-top: 4px;
  font: inherit; font-size: 24px; font-weight: 700; letter-spacing: .4em; text-indent: .4em;
  color: #2b0b1a; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg, #ffb6d2 0%, var(--sakura) 40%, var(--sakura-deep) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 10px 30px -6px rgba(238, 109, 163, .55);
  transition: transform .1s, filter .2s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px) scale(.995); }

/* Done */
.done { flex: 1; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; padding-bottom: 10dvh; }
.done h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .12em; }
.done p { margin: 0; color: var(--ink-soft); font-size: 20px; letter-spacing: .1em; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">渋谷桜丘</div>
    <h1><span class="ph">さくら坂イルミネーション</span><span class="ph">写真コンテスト</span></h1>
    <svg class="garland" viewBox="0 0 520 34" preserveAspectRatio="none" aria-hidden="true" id="garland"></svg>
  </header>

  <form id="entry" novalidate>
    <div class="field" id="f-title">
      <label class="q" for="title">タイトル</label>
      <input type="text" id="title" autocomplete="off" maxlength="50" placeholder="例）桜色の坂道">
      <p class="err" id="e-title" hidden></p>
    </div>
    <div class="field" id="f-name">
      <label class="q" for="name">お名前</label>
      <input type="text" id="name" autocomplete="name" maxlength="40" placeholder="例）渋谷 花子">
      <p class="err" id="e-name" hidden></p>
    </div>
    <div class="field" id="f-photo">
      <span class="q" id="photo-q">写真</span>
      <label class="photo-btn" id="photo-btn">
        <span class="ico" id="cam" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="13.5" rx="3"/><circle cx="12" cy="13.2" r="3.5"/><path d="M8.6 6.5l1.3-2.2h4.2l1.3 2.2"/></svg></span>
        <img id="preview" alt="選んだ写真" hidden>
        <span id="photo-label">写真をえらぶ</span>
        <input type="file" id="photo" accept="image/jpeg,.jpg,.jpeg" aria-labelledby="photo-q">
      </label>
      <p class="err" id="e-photo" hidden></p>
    </div>
    <div class="field" id="f-email">
      <label class="q" for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="例）hanako@example.com">
      <p class="err" id="e-email" hidden></p>
    </div>
    <button class="btn" type="submit">応募する</button>
  </form>

  <section class="done" id="done" hidden>
    <h2 id="d-h" tabindex="-1">応募しました</h2>
    <p>ありがとうございました</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let photoURL = null;

// 電飾：木から木へ渡したゆるい2本のたるみ
(function () {
  const svg = $('garland'), ns = 'http://www.w3.org/2000/svg';
  const swags = [[8, 6, 260, 4], [260, 4, 512, 8]];
  let k = 0;
  for (const [x1, y1, x2, y2] of swags) {
    const cx = (x1 + x2) / 2, cy = 40;
    const wire = document.createElementNS(ns, 'path');
    wire.setAttribute('d', `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`);
    wire.setAttribute('class', 'wire'); svg.appendChild(wire);
    const n = 13;
    for (let i = 1; i < n; i++) {
      const t = i / n, x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2,
            y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t * t * y2;
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', (y + 2.5).toFixed(1));
      c.setAttribute('r', k % 4 === 3 ? 2.6 : 3.4);
      c.setAttribute('class', 'bulb' + (k % 4 === 3 ? ' g' : ''));
      c.style.animationDelay = ((k * 0.37) % 3.2).toFixed(2) + 's';
      svg.appendChild(c); k++;
    }
  }
})();

function setPhoto(url) {
  if (photoURL && photoURL.startsWith('blob:')) URL.revokeObjectURL(photoURL);
  photoURL = url;
  $('preview').src = url || ''; $('preview').hidden = !url; $('cam').hidden = !!url;
  $('photo-btn').classList.toggle('has', !!url);
  $('photo-label').textContent = url ? '写真をかえる' : '写真をえらぶ';
}
function setErr(k, msg) {
  $('e-' + k).textContent = msg || ''; $('e-' + k).hidden = !msg;
  $('f-' + k).classList.toggle('invalid', !!msg);
}

$('photo').addEventListener('change', e => {
  const f = e.target.files[0]; setErr('photo');
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return setErr('photo', '写真が大きすぎます');
  setPhoto(URL.createObjectURL(f));
});
['title', 'name', 'email'].forEach(k => $(k).addEventListener('input', () => setErr(k)));

$('entry').addEventListener('submit', e => {
  e.preventDefault();
  const v = { title: $('title').value.trim(), name: $('name').value.trim(), email: $('email').value.trim() };
  let first = null;
  if (!v.title) { setErr('title', 'タイトルを入れてください'); first ??= 'title'; }
  if (!v.name) { setErr('name', 'お名前を入れてください'); first ??= 'name'; }
  if (!photoURL) { setErr('photo', '写真をえらんでください'); first ??= 'photo'; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) { setErr('email', 'メールアドレスを確かめてください'); first ??= 'email'; }
  if (first) { if (first !== 'photo') $(first).focus(); return; }
  $('entry').hidden = true; $('done').hidden = false; $('d-h').focus();
});
</script>
</body>
</html>
